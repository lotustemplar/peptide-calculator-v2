# Internal-test / debug APK (Issue #18). Not Play Store. Not a production deploy.
# Download: GitHub Actions artifact only. Do not create or update a GitHub Release.
name: Android APK

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - grok/18-capacitor-android-apk

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # pull_request GITHUB_SHA is the merge commit. Name the APK as the branch head.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      apk_sha256: ${{ steps.checksum.outputs.sha256 }}
      apk_name: ${{ steps.checksum.outputs.apk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Prepare www/ and sync Capacitor Android
        run: |
          node scripts/android/prepare-www.js
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name APK and checksum
        id: checksum
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${SOURCE_SHA}" | cut -c1-7)"
          SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          NAME="FitGen-Peptide-Calculator-internal-test-debug-${SHORT_SHA}.apk"
          mkdir -p dist-apk
          cp "$SRC" "dist-apk/${NAME}"
          HASH="$(sha256sum "dist-apk/${NAME}" | awk '{print $1}')"
          echo "$HASH  ${NAME}" | tee "dist-apk/${NAME}.sha256"
          echo "sha256=${HASH}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Internal-test APK"
            echo ""
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- APK filename: \`${NAME}\`"
            echo "- SHA-256: \`${HASH}\`"
            echo "- Signing: Gradle debug keystore on this runner (no release secret)"
            echo "- Download: this workflow's Actions artifact \`fitgen-internal-test-apk\` (not a GitHub Release)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts (private to this repo)
        uses: actions/upload-artifact@v4
        with:
          name: fitgen-internal-test-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            dist-apk/${{ steps.checksum.outputs.apk_name }}
            dist-apk/${{ steps.checksum.outputs.apk_name }}.sha256

  emulator-smoke:
    name: Emulator install+launch (best effort)
    needs: build-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: fitgen-internal-test-apk
          path: dist-apk

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One command: this action runs each script line in a fresh /usr/bin/sh.
          script: sh scripts/android/emulator-smoke.sh

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-log
          if-no-files-found: ignore
          path: emulator-activities.log
